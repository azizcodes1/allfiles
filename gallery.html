<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxePrompt Gallery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --accent: #d4af37;
            --text: #e0e0e0;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent);
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 600px;
            justify-content: center;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .tab.active {
            opacity: 1;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .img-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: transform 0.3s ease;
            position: relative; /* For absolute positioning of delete button */
        }

        .img-card:hover {
            transform: scale(1.03);
            border-color: var(--accent);
        }

        .btn-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.2s ease;
            z-index: 10;
        }

        .img-card:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            transform: scale(1.1);
            background: #ff3b30;
        }

        .img-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .img-info {
            padding: 10px;
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .prompt-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .author {
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .btn-public {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .btn-public:hover {
            background: var(--accent);
            color: black;
        }

        .btn-private {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #ccc;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 5px;
        }

        .btn-private:hover {
            background: rgba(212, 175, 55, 0.3);
            color: white;
            border-color: var(--accent);
        }

        .empty-msg {
            text-align: center;
            margin-top: 50px;
            opacity: 0.5;
        }

        /* Loading Animation */
        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-top: 50px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Luxe Archive</h1>
        <div class="subtitle">Your Bespoke Visual Collection</div>
    </header>

    <div class="tabs">
        <div id="tab-private" class="tab active" onclick="switchTab('private')">MY ARCHIVE</div>
        <div id="tab-public" class="tab" onclick="switchTab('public')">MASTERPIECES</div>
    </div>

    <div id="loader" class="loader"></div>
    <div id="gallery" class="gallery-grid" style="display: none;"></div>
    <div id="empty" class="empty-msg" style="display: none;">No masterpieces found here.<br>Start creating your legacy.
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // CHANGE THIS to your ngrok or server URL (must be HTTPS for GitHub Pages to work)
        const API_BASE_URL = "https://kung-doily-thumb.ngrok-free.dev";

        let currentTab = 'private';
        let userId = tg.initDataUnsafe?.user?.id || 12345678; // Fallback for testing

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            renderGallery();
        }

        async function renderGallery() {
            const gallery = document.getElementById('gallery');
            const empty = document.getElementById('empty');
            const loader = document.getElementById('loader');

            gallery.style.display = 'none';
            empty.style.display = 'none';
            loader.style.display = 'block';
            gallery.innerHTML = '';

            try {
                let url = currentTab === 'private'
                    ? `${API_BASE_URL}/api/gallery/${userId}`
                    : `${API_BASE_URL}/api/masterpieces`;

                const response = await fetch(url, {
                    headers: {
                        'ngrok-skip-browser-warning': 'true'
                    }
                });
                const data = await response.json();

                loader.style.display = 'none';

                if (!data || data.length === 0) {
                    empty.style.display = 'block';
                } else {
                    gallery.style.display = 'grid';
                    data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'img-card';

                        let actionHtml = '';
                        if (currentTab === 'private') {
                            actionHtml = item.is_public
                                ? `<button class="btn-private" onclick="makePrivate(${item.id})">Do Private</button>`
                                : `<button class="btn-public" onclick="makePublic(${item.id})">Do Public</button>`;
                        } else {
                            actionHtml = `<div class="author">By ${item.full_name || item.username || 'Anonymous'}</div>`;
                        }

                        let deleteHtml = currentTab === 'private' 
                            ? `<button class="btn-delete" onclick="deleteImage(${item.id})">✕</button>` 
                            : '';

                        card.innerHTML = `
                            ${deleteHtml}
                            <img src="${item.image_url}" alt="Masterpiece">
                            <div class="img-info">
                                ${actionHtml}
                                <div class="prompt-text">${item.prompt}</div>
                            </div>
                        `;
                        gallery.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("API Error:", error);
                loader.style.display = 'none';
                empty.innerText = "Connection Error. Ensure the API is running.";
                empty.style.display = 'block';
            }
        }

        async function makePublic(id) {
            tg.showConfirm("Do you want to make this vision public in the Global Masterpieces gallery?", async (ok) => {
                if (ok) {
                    try {
                        await fetch(`${API_BASE_URL}/api/make-public/${id}`, {
                            method: 'POST',
                            headers: {
                                'ngrok-skip-browser-warning': 'true'
                            }
                        });
                        tg.showAlert("Your masterpiece has been shared with the world!");
                        renderGallery();
                    } catch (e) {
                        tg.showAlert("Failed to publish. Check your connection.");
                    }
                }
            });
        }

        async function makePrivate(id) {
            tg.showConfirm("Do you want to hide this from the Global Gallery?", async (ok) => {
                if (ok) {
                    try {
                        await fetch(`${API_BASE_URL}/api/make-private/${id}`, {
                            method: 'POST',
                            headers: {
                                'ngrok-skip-browser-warning': 'true'
                            }
                        });
                        tg.showAlert("Image is now private.");
                        renderGallery();
                    } catch (e) {
                        tg.showAlert("Failed to update status.");
                    }
                }
            });
        }

        async function deleteImage(id) {
            tg.showConfirm("Are you sure you want to delete this masterpiece forever?", async (ok) => {
                if (ok) {
                    try {
                        await fetch(`${API_BASE_URL}/api/delete-image/${id}`, {
                            method: 'DELETE',
                            headers: {
                                'ngrok-skip-browser-warning': 'true'
                            }
                        });
                        tg.showAlert("Vision deleted.");
                        renderGallery();
                    } catch (e) {
                        tg.showAlert("Failed to delete.");
                    }
                }
            });
        }

        renderGallery();
    </script>
</body>

</html>
